services:
  mysql:
    image: mysql:8.4
    container_name: financy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: financy
    volumes:
      - financy-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: financy-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo # mês/dia corrente no fuso do usuário
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/financy
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env da raiz}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false} # cadastro desabilitado por padrão
      PORT: 3333
    ports:
      - "3333:3333"

volumes:
  financy-mysql:
